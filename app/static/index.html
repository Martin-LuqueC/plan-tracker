<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plan Tracker</title>
  <link rel="stylesheet" href="/static/estilo.css">
</head>
<body>
  <header class="barra">
    <div class="barra-plan" id="plan"></div>
    <div class="barra-dia" id="dia"></div>
    <div class="barra-derecha">
      <div class="barra-avance">
        <span id="avance-texto"></span>
        <span class="avance-pista"><span class="avance-relleno" id="avance-relleno"></span></span>
      </div>
      <button class="boton-actualizar" id="actualizar" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="actualizar-texto"></span>
      </button>
      <span class="actualizado" id="actualizado"></span>
      <div class="idiomas" role="group" aria-label="Idioma">
        <button type="button" data-idioma="es">ES</button>
        <button type="button" data-idioma="en">EN</button>
      </div>
    </div>
  </header>

  <div class="aviso" id="aviso" hidden></div>

  <main class="cuadrantes" id="cuadrantes"></main>

  <div class="fondo-panel" id="fondo-panel" hidden>
    <section class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-titulo">
      <button class="panel-cerrar" id="panel-cerrar" type="button">×</button>
      <h2 id="panel-titulo"></h2>
      <p class="panel-sub" id="panel-sub"></p>
      <p class="panel-meta" id="panel-meta"></p>
      <form id="panel-form" autocomplete="off">
        <div class="campo">
          <span class="campo-nombre" id="l-estado"></span>
          <div class="segmentos" id="f-estado" role="group">
            <button type="button" data-valor="pendiente"></button>
            <button type="button" data-valor="en_curso"></button>
            <button type="button" data-valor="hecho"></button>
          </div>
        </div>
        <label class="campo">
          <span class="campo-nombre" id="l-detalle"></span>
          <textarea id="f-detalle" rows="3"></textarea>
        </label>
        <label class="campo">
          <span class="campo-nombre" id="l-notas"></span>
          <textarea id="f-notas" rows="3"></textarea>
        </label>
        <div class="fila-campos">
          <label class="campo">
            <span class="campo-nombre" id="l-fecha"></span>
            <input type="date" id="f-fecha">
          </label>
          <label class="campo">
            <span class="campo-nombre" id="l-hora"></span>
            <input type="time" id="f-hora">
          </label>
          <label class="campo">
            <span class="campo-nombre" id="l-duracion"></span>
            <input type="number" id="f-duracion" min="0" max="1440" step="5" inputmode="numeric">
          </label>
        </div>
        <div class="panel-pie">
          <span class="panel-mensaje" id="panel-mensaje" role="status"></span>
          <button type="button" class="boton-secundario" id="f-agendar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 10h17M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span id="f-agendar-texto"></span>
          </button>
          <button type="submit" class="boton-principal" id="f-guardar"></button>
        </div>
      </form>
    </section>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
