<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plan Tracker</title>
  <link rel="icon" href="/static/icono.svg" type="image/svg+xml">
  <link rel="icon" href="/static/icono.png" type="image/png" sizes="256x256">
  <link rel="stylesheet" href="/static/estilo.css">
</head>
<body>
  <header class="barra">
    <div class="barra-plan">
      <span id="plan"></span>
      <button type="button" class="boton-mas" id="nuevo-plan">+</button>
      <div class="paleta-caja">
        <button type="button" class="boton-paleta" id="boton-paleta" aria-haspopup="true" aria-expanded="false">
          <span class="muestra"></span>
        </button>
        <div class="menu-paleta" id="menu-paleta" role="menu" hidden></div>
      </div>
    </div>
    <div class="barra-dia" id="dia"></div>
    <div class="idiomas vistas" id="vistas" role="group" hidden>
      <button type="button" data-vista="4"></button>
      <button type="button" data-vista="todas"></button>
    </div>
    <div class="barra-derecha">
      <div class="barra-avance">
        <span id="avance-texto"></span>
        <span class="avance-pista"><span class="avance-relleno" id="avance-relleno"></span></span>
      </div>
      <button class="boton-actualizar" id="actualizar" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="actualizar-texto"></span>
      </button>
      <span class="actualizado" id="actualizado"></span>
      <div class="idiomas" role="group" aria-label="Idioma">
        <button type="button" data-idioma="es">ES</button>
        <button type="button" data-idioma="en">EN</button>
      </div>
    </div>
  </header>

  <div class="aviso" id="aviso" hidden></div>

  <main class="cuadrantes" id="cuadrantes"></main>

  <div class="fondo-panel" id="fondo-panel" hidden>
    <section class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-titulo">
      <button class="panel-cerrar" id="panel-cerrar" type="button">×</button>
      <h2 id="panel-titulo"></h2>
      <p class="panel-sub" id="panel-sub"></p>
      <p class="panel-meta" id="panel-meta"></p>
      <form id="panel-form" autocomplete="off">
        <div class="campo">
          <span class="campo-nombre" id="l-estado"></span>
          <div class="segmentos" id="f-estado" role="group">
            <button type="button" data-valor="pendiente"></button>
            <button type="button" data-valor="en_curso"></button>
            <button type="button" data-valor="hecho"></button>
          </div>
        </div>
        <label class="campo">
          <span class="campo-nombre" id="l-detalle"></span>
          <textarea id="f-detalle" rows="3"></textarea>
        </label>
        <label class="campo">
          <span class="campo-nombre" id="l-notas"></span>
          <textarea id="f-notas" rows="3"></textarea>
        </label>
        <div class="fila-campos">
          <label class="campo">
            <span class="campo-nombre" id="l-fecha"></span>
            <input type="date" id="f-fecha">
          </label>
          <label class="campo">
            <span class="campo-nombre" id="l-hora"></span>
            <input type="time" id="f-hora">
          </label>
          <label class="campo">
            <span class="campo-nombre" id="l-duracion"></span>
            <input type="number" id="f-duracion" min="0" max="1440" step="5" inputmode="numeric">
          </label>
        </div>
        <div class="panel-pie">
          <span class="panel-mensaje" id="panel-mensaje" role="status"></span>
          <button type="button" class="boton-secundario" id="f-agendar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 10h17M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span id="f-agendar-texto"></span>
          </button>
          <button type="submit" class="boton-principal" id="f-guardar"></button>
        </div>
      </form>
    </section>
  </div>

  <div class="fondo-panel" id="fondo-plan" hidden>
    <section class="panel" role="dialog" aria-modal="true" aria-labelledby="plan-titulo">
      <button class="panel-cerrar" id="plan-cerrar" type="button">×</button>
      <h2 id="plan-titulo"></h2>
      <p class="panel-sub" id="plan-sub"></p>
      <form id="plan-form" class="formulario" autocomplete="off">
        <label class="campo">
          <span class="campo-nombre" id="l-plan-nombre"></span>
          <input type="text" id="p-nombre" maxlength="80" required>
        </label>
        <label class="campo">
          <span class="campo-nombre" id="l-plan-nombre-en"></span>
          <input type="text" id="p-nombre-en" maxlength="80">
        </label>
        <div class="fila-campos dos">
          <label class="campo">
            <span class="campo-nombre" id="l-plan-inicio"></span>
            <input type="date" id="p-inicio" required>
          </label>
          <label class="campo">
            <span class="campo-nombre" id="l-plan-semanas"></span>
            <select id="p-semanas"></select>
          </label>
        </div>
        <p class="plan-fin" id="p-fin"></p>
        <div class="campo">
          <span class="campo-nombre" id="l-plan-color"></span>
          <div class="colores" id="p-color" role="radiogroup"></div>
        </div>
        <div class="panel-pie">
          <span class="panel-mensaje" id="plan-mensaje" role="status"></span>
          <button type="submit" class="boton-principal" id="p-crear"></button>
        </div>
      </form>
    </section>
  </div>

  <div class="fondo-panel" id="fondo-tarea" hidden>
    <section class="panel" role="dialog" aria-modal="true" aria-labelledby="tarea-titulo">
      <button class="panel-cerrar" id="tarea-cerrar" type="button">×</button>
      <h2 id="tarea-titulo"></h2>
      <p class="panel-sub" id="tarea-sub"></p>
      <form id="tarea-form" class="formulario" autocomplete="off">
        <label class="campo">
          <span class="campo-nombre" id="l-t-titulo"></span>
          <input type="text" id="t-titulo" maxlength="120" required>
        </label>
        <div class="campo">
          <span class="campo-nombre" id="l-t-frecuencia"></span>
          <div class="segmentos cinco" id="t-frecuencia" role="group">
            <button type="button" data-valor="una_vez"></button>
            <button type="button" data-valor="diaria"></button>
            <button type="button" data-valor="dias_habiles"></button>
            <button type="button" data-valor="semanal"></button>
            <button type="button" data-valor="veces"></button>
          </div>
        </div>
        <label class="campo" id="c-t-veces" hidden>
          <span class="campo-nombre" id="l-t-veces"></span>
          <input type="number" id="t-veces" min="1" max="14" step="1" value="5" inputmode="numeric">
        </label>
        <label class="campo" id="c-t-dia" hidden>
          <span class="campo-nombre" id="l-t-dia"></span>
          <select id="t-dia"></select>
        </label>
        <label class="campo">
          <span class="campo-nombre" id="l-t-meta"></span>
          <input type="text" id="t-meta" maxlength="120">
        </label>
        <label class="campo">
          <span class="campo-nombre" id="l-t-detalle"></span>
          <textarea id="t-detalle" rows="3"></textarea>
        </label>
        <div class="panel-pie">
          <span class="panel-mensaje" id="tarea-mensaje" role="status"></span>
          <button type="submit" class="boton-principal" id="t-crear"></button>
        </div>
      </form>
    </section>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
